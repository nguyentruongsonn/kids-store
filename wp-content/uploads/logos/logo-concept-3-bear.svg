<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="bearPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A94F65"/>
      <stop offset="100%" stop-color="#7B2F44"/>
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDA73"/>
      <stop offset="100%" stop-color="#EAA63B"/>
    </linearGradient>
    <filter id="bearGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#A94F65" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Left Mascot: Baby Bear with Little Gold Crown -->
  <g transform="translate(8, 8)">
    <!-- Base Circular Badge -->
    <circle cx="37" cy="37" r="36" fill="#FFFDF9" stroke="#E6CCD2" stroke-width="2" filter="url(#bearGlow)"/>

    <!-- Left Bear Ear -->
    <circle cx="21" cy="22" r="10.5" fill="#FAF0F2" stroke="#A94F65" stroke-width="2.2"/>
    <circle cx="21" cy="22" r="5.5" fill="#F4D3DA"/>

    <!-- Right Bear Ear -->
    <circle cx="53" cy="22" r="10.5" fill="#FAF0F2" stroke="#A94F65" stroke-width="2.2"/>
    <circle cx="53" cy="22" r="5.5" fill="#F4D3DA"/>

    <!-- Bear Head -->
    <circle cx="37" cy="42" r="23" fill="#FFFDF9" stroke="#A94F65" stroke-width="2.2"/>

    <!-- Tiny Royal Crown on Bear's Head -->
    <g transform="translate(37, 19)">
      <polygon points="-8,3 -10,-7 -4,-3 0,-9 4,-3 10,-7 8,3" fill="url(#crownGold)" stroke="#D49026" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="-10" cy="-7" r="1.3" fill="#D49026"/>
      <circle cx="0" cy="-9" r="1.5" fill="#D49026"/>
      <circle cx="10" cy="-7" r="1.3" fill="#D49026"/>
    </g>

    <!-- Eyes (Cute Wink or Sweet Smile) -->
    <circle cx="28" cy="39" r="2.2" fill="#3C2D31"/>
    <circle cx="29" cy="38" r="0.8" fill="#FFF"/>
    <path d="M 43 38 Q 46 41 49 38" fill="none" stroke="#3C2D31" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Snout Pill -->
    <ellipse cx="37" cy="48" rx="9" ry="7" fill="#FAF0F2"/>

    <!-- Heart Nose -->
    <path d="M 37 45 C 35.8 43.8 34.5 44.8 35.5 46 L 37 47.8 L 38.5 46 C 39.5 44.8 38.2 43.8 37 45 Z" fill="#A94F65"/>

    <!-- Cute Smiling Mouth -->
    <path d="M 37 47.8 Q 37 50.2 34 50.8 M 37 47.8 Q 37 50.2 40 50.8" fill="none" stroke="#3C2D31" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Rosy Cheeks -->
    <circle cx="23" cy="45" r="3.2" fill="#F8BAC6" opacity="0.9"/>
    <circle cx="51" cy="45" r="3.2" fill="#F8BAC6" opacity="0.9"/>
  </g>

  <!-- Right Typography: "cưng" & "PREMIUM KIDS WEAR" -->
  <g transform="translate(94, 0)">
    <text x="0" y="52" 
          font-family="'Be Vietnam Pro', 'Quicksand', sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="-0.5" 
          fill="url(#bearPinkGrad)">cưng</text>

    <!-- Little Sparkle -->
    <path d="M 112 16 Q 112 21 117 21 Q 112 21 112 26 Q 112 21 107 21 Q 112 21 112 16 Z" fill="#EAA63B"/>

    <!-- Subtitle: PREMIUM KIDS WEAR -->
    <text x="2" y="72" 
          font-family="'Montserrat', 'Be Vietnam Pro', sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="3.2" 
          fill="#3C2D31" 
          opacity="0.85">PREMIUM KIDS WEAR</text>
  </g>
</svg>
