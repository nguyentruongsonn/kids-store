<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 85" width="320" height="85">
  <defs>
    <linearGradient id="cungGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A94F65" />
      <stop offset="100%" stop-color="#8F3F54" />
    </linearGradient>
    <filter id="cungSoftGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A94F65" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Emblem: Cute Baby Bear with Sprout & Heart -->
  <g transform="translate(6, 6)">
    <!-- Soft Background Pebble / Squircle -->
    <rect x="0" y="0" width="72" height="72" rx="36" fill="#FFF9FA" stroke="#F0DEE2" stroke-width="2" filter="url(#cungSoftGlow)" />

    <!-- Bear Ears -->
    <!-- Left Ear -->
    <circle cx="16" cy="16" r="10.5" fill="#FAF0F2" stroke="#A94F65" stroke-width="2.5" />
    <circle cx="16" cy="16" r="5.5" fill="#F4D3DA" />
    <!-- Right Ear -->
    <circle cx="56" cy="16" r="10.5" fill="#FAF0F2" stroke="#A94F65" stroke-width="2.5" />
    <circle cx="56" cy="16" r="5.5" fill="#F4D3DA" />

    <!-- Head -->
    <circle cx="36" cy="40" r="26" fill="#FFFFFF" stroke="#A94F65" stroke-width="2.5" />

    <!-- Sleeping Happy Eyes -->
    <path d="M 23 37 Q 27.5 42 32 37" fill="none" stroke="#3C2D31" stroke-width="2.6" stroke-linecap="round" />
    <path d="M 40 37 Q 44.5 42 49 37" fill="none" stroke="#3C2D31" stroke-width="2.6" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <ellipse cx="22" cy="44" rx="4.5" ry="3" fill="#F8BAC6" opacity="0.85" />
    <ellipse cx="50" cy="44" rx="4.5" ry="3" fill="#F8BAC6" opacity="0.85" />

    <!-- Heart Nose -->
    <path d="M 36 43 C 34.2 41 31.8 42.8 33.5 45 L 36 47.8 L 38.5 45 C 40.2 42.8 37.8 41 36 43 Z" fill="#A94F65" />

    <!-- Sweet Smiling Mouth -->
    <path d="M 36 47.8 Q 36 51 32.5 52 M 36 47.8 Q 36 51 39.5 52" fill="none" stroke="#3C2D31" stroke-width="2" stroke-linecap="round" />

    <!-- Natural Organic Green Sprout on Head -->
    <path d="M 36 14 C 33.5 7.5 39.5 4.5 42.5 8.5 C 45.5 12.5 38.5 13.5 36 14 Z" fill="#88A878" />
    <path d="M 36 14 C 38 9 32 6 30 10.5 C 28 14.5 34 14.5 36 14 Z" fill="#9CBD8B" />
    <path d="M 36 19 L 36 13" fill="none" stroke="#88A878" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Right Typography: "cưng" and "THỜI TRANG CHO BÉ" -->
  <g transform="translate(94, 0)">
    <!-- Brand Name: "cưng" with customized heart/leaf accent -->
    <text x="0" y="52" 
          font-family="'Be Vietnam Pro', 'Quicksand', 'Nunito', 'Segoe UI', sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="-0.5" 
          fill="url(#cungGradient)">cưng</text>

    <!-- Adorable little heart above the wordmark -->
    <path d="M 104 22 C 102.5 19.8 99.5 21.8 101.5 24.2 L 104 27 L 106.5 24.2 C 108.5 21.8 105.5 19.8 104 22 Z" fill="#E8A598" />

    <!-- Sub-tagline: "THỜI TRANG CHO BÉ" -->
    <text x="2" y="71" 
          font-family="'Be Vietnam Pro', 'Segoe UI', sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="3.2" 
          fill="#3C2D31">THỜI TRANG CHO BÉ</text>
  </g>
</svg>
