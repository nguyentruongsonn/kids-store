<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 80" width="245" height="80">
  <defs>
    <linearGradient id="cungGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A94F65" />
      <stop offset="100%" stop-color="#8F3F54" />
    </linearGradient>
    <filter id="cungSoftGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#A94F65" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Emblem: Cute Baby Bear with Sprout & Heart -->
  <g transform="translate(4, 5)">
    <!-- Soft Background Squircle -->
    <rect x="0" y="0" width="70" height="70" rx="35" fill="#FFF9FA" stroke="#F0DEE2" stroke-width="2" filter="url(#cungSoftGlow)" />

    <!-- Bear Ears -->
    <!-- Left Ear -->
    <circle cx="15" cy="15" r="10" fill="#FAF0F2" stroke="#A94F65" stroke-width="2.5" />
    <circle cx="15" cy="15" r="5" fill="#F4D3DA" />
    <!-- Right Ear -->
    <circle cx="55" cy="15" r="10" fill="#FAF0F2" stroke="#A94F65" stroke-width="2.5" />
    <circle cx="55" cy="15" r="5" fill="#F4D3DA" />

    <!-- Head -->
    <circle cx="35" cy="39" r="25" fill="#FFFFFF" stroke="#A94F65" stroke-width="2.5" />

    <!-- Sleeping Happy Eyes -->
    <path d="M 22.5 36.5 Q 27 41.5 31.5 36.5" fill="none" stroke="#3C2D31" stroke-width="2.6" stroke-linecap="round" />
    <path d="M 38.5 36.5 Q 43 41.5 47.5 36.5" fill="none" stroke="#3C2D31" stroke-width="2.6" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <ellipse cx="21" cy="43.5" rx="4.5" ry="3" fill="#F8BAC6" opacity="0.85" />
    <ellipse cx="49" cy="43.5" rx="4.5" ry="3" fill="#F8BAC6" opacity="0.85" />

    <!-- Heart Nose -->
    <path d="M 35 42.5 C 33.3 40.5 31 42.2 32.6 44.3 L 35 47 L 37.4 44.3 C 39 42.2 36.7 40.5 35 42.5 Z" fill="#A94F65" />

    <!-- Sweet Smiling Mouth -->
    <path d="M 35 47 Q 35 50.2 31.5 51.2 M 35 47 Q 35 50.2 38.5 51.2" fill="none" stroke="#3C2D31" stroke-width="2" stroke-linecap="round" />

    <!-- Natural Organic Green Sprout on Head -->
    <path d="M 35 13.5 C 32.5 7 38.5 4 41.5 8 C 44.5 12 37.5 13 35 13.5 Z" fill="#88A878" />
    <path d="M 35 13.5 C 37 8.5 31 5.5 29 10 C 27 14 33 14 35 13.5 Z" fill="#9CBD8B" />
    <path d="M 35 18.5 L 35 12.5" fill="none" stroke="#88A878" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Right Typography: "cưng" and "THỜI TRANG CHO BÉ" -->
  <g transform="translate(86, 0)">
    <!-- Brand Name: "cưng" with customized heart/leaf accent -->
    <text x="0" y="48" 
          font-family="'Be Vietnam Pro', 'Quicksand', 'Nunito', 'Segoe UI', sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="-0.5" 
          fill="url(#cungGradient)">cưng</text>

    <!-- Adorable little heart above the wordmark -->
    <path d="M 104 18 C 102.5 15.8 99.5 17.8 101.5 20.2 L 104 23 L 106.5 20.2 C 108.5 17.8 105.5 15.8 104 18 Z" fill="#E8A598" />

    <!-- Subtitle / Brand Tagline -->
    <text x="2" y="66" 
          font-family="'Be Vietnam Pro', 'Montserrat', 'Segoe UI', sans-serif" 
          font-size="10.5" 
          font-weight="700" 
          letter-spacing="2.8" 
          fill="#8F3F54" 
          opacity="0.9">THỜI TRANG CHO BÉ</text>
  </g>
</svg>
